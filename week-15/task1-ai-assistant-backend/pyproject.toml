[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "engineering-ai-assistant"
version = "0.1.0"
description = "A FastAPI AI assistant with RAG, structured output, and tool calling."
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "google-auth>=2.40,<3.0",
    "httpx>=0.28,<1.0",
    # The SDK targets Hugging Face Router through its compatible HTTP protocol.
    "openai>=1.60,<3.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pypdf>=5.1,<7.0",
    "python-multipart>=0.0.20,<1.0",
    "qdrant-client>=1.13,<2.0",
    "redis>=6.0,<7.0",
    "requests>=2.32,<3.0",
    "sentence-transformers>=3.3,<6.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1.0",
]

# Development tools are optional so the production image installs only runtime code.
[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "pytest-cov>=6.0,<8.0",
    "respx>=0.22,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require a running external service",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
